[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "datalab-camera-characterization"
version = "0.1.0"
description = "Relative characterization of scientific cameras and detectors"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["datalab-platform >= 1.3", "numpy >= 1.22"]

[project.entry-points."datalab.plugins"]
datalab_camera_characterization = "datalab_camera_characterization.adapters.desktop:CameraDetectorCharacterizationPlugin"

[project.optional-dependencies]
test = ["build >= 1.2", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datalab_camera_characterization = ["examples/*.h5"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
