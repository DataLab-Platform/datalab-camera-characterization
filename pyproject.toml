[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "datalab-camera-characterization"
version = "0.2.0"
description = "Characterization of scientific cameras and detectors"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["datalab-platform >= 1.3, < 2", "numpy >= 1.22", "scipy >= 1.10.1"]
keywords = ["datalab", "datalab-plugin", "camera", "detector", "photon transfer"]

[project.urls]
Homepage = "https://github.com/DataLab-Platform/datalab-camera-characterization"
Issues = "https://github.com/DataLab-Platform/datalab-camera-characterization/issues"

[project.entry-points."datalab.plugins"]
datalab_camera_characterization = "datalab_camera_characterization.adapters.desktop:CameraDetectorCharacterizationPlugin"

[project.entry-points."datalab.web_plugins"]
datalab_camera_characterization = "datalab_camera_characterization.adapters.web:CameraDetectorCharacterizationWebPlugin"

[project.optional-dependencies]
test = ["build >= 1.2", "psutil >= 5.8", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datalab_camera_characterization = ["examples/*.h5", "icons/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
